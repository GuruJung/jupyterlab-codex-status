name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config
      - run: ./compose-test.sh
      - run: ./compose-build.sh
      - run: ./compose-export.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: compose-reports
          path: |
            playwright-report
            test-results

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / JupyterLab ${{ matrix.jupyterlab }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: '3.10'
            jupyterlab: '==4.4.0'
          - os: macos-latest
            python: '3.13'
            jupyterlab: '==4.6.1'
          - os: ubuntu-latest
            python: '3.12'
            jupyterlab: '>=4.4,<5'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install "jupyterlab${{ matrix.jupyterlab }}" build pytest pytest-asyncio
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: jupyter labextension list
      - run: jupyter server extension list
