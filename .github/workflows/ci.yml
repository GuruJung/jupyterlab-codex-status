name: CI

on:
  push:
  pull_request:

jobs:
  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: ./compose-test.sh
      - run: ./compose-build.sh
      - run: ./compose-export.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-reports
          path: |
            playwright-report
            test-results

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / JupyterLab ${{ matrix.jupyterlab }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: '3.10'
            jupyterlab: '==4.4.0'
          - os: macos-latest
            python: '3.13'
            jupyterlab: '==4.6.1'
          - os: ubuntu-latest
            python: '3.12'
            jupyterlab: '>=4.4,<5'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install "jupyterlab${{ matrix.jupyterlab }}" build pytest pytest-asyncio
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: jupyter labextension list
      - run: jupyter server extension list
