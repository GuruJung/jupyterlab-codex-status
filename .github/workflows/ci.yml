name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config
      - run: ./compose-test.sh
      - run: ./compose-build.sh
      - run: ./compose-export.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: compose-reports
          path: |
            playwright-report
            test-results

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / JupyterLab ${{ matrix.jupyterlab }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: '3.10'
            jupyterlab: '==4.4.0'
          - os: macos-latest
            python: '3.13'
            jupyterlab: '==4.6.1'
          - os: ubuntu-latest
            python: '3.12'
            jupyterlab: '>=4.4,<5'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install -e . "jupyterlab${{ matrix.jupyterlab }}" build pytest pytest-asyncio
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: jupyter labextension list
      - run: jupyter server extension list
